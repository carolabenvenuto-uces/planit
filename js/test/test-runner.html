<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Prueba Jasmine</title>
    <!--
        El runner no hace ninguna request a internet: Jasmine, Bootstrap y Chart.js se
        cargan desde copias locales en vendor/ (ver vendor/LEEME.md: origen, versión,
        hash y licencia de cada archivo). Así un CDN caído no rompe `npm test`.
    -->
    <!-- Jasmine 5.10.0 (paquete npm jasmine-core@5.10.0) -->
    <link rel="shortcut icon" type="image/png" href="vendor/jasmine-5.10.0/jasmine_favicon.png">
    <link rel="stylesheet" href="vendor/jasmine-5.10.0/jasmine.css">

    <!-- Jasmine Core JavaScript -->
    <script src="vendor/jasmine-5.10.0/jasmine.js"></script>
    <script src="vendor/jasmine-5.10.0/jasmine-html.js"></script>
    <script src="vendor/jasmine-5.10.0/boot0.js"></script>
    <script src="vendor/jasmine-5.10.0/boot1.js"></script>
</head>
<body>
    <!--
        Fixture de DOM para script.spec.js, api.spec.js y library.spec.js: subconjunto de
        index.html con los mismos id que lee js/script.js en obtenerReferenciasUI().
        Ya nada se arma desde el marcado: crearEventoInicial() toma los datos generales
        del #form-evento y el presupuesto y los invitados de DATOS_SEMILLA, y
        construirCatalogo() pide el catálogo a ApiService (fetch de api/proveedores.json,
        respondido por el stub de más abajo). Las filas data-item, las tarjetas
        data-proveedor y las filas de #lista-invitados solo son el estado previo a esa
        carga: el controlador las reemplaza al renderizar. Los canvas #grafico-presupuesto
        y #grafico-catalogo, con sus avisos #aviso-grafico-*, son los de Chart.js (PR #149).
        No incluye el Modal de detalle ni el Toast de
        confirmación: los specs de integración RC14/RC15 los montan en un sandbox propio
        (copiado de index.html) y lo retiran al terminar, así configurarEventos() sigue
        corriendo al inicio sin esos nodos. Bootstrap JS es el mismo archivo que usa
        index.html, para probar el Modal y el Toast reales; RC15 también lo quita a
        propósito para probar la degradación (ver spec-tester-qa.md, MOMENTO 2, sección 6).
    -->
    <div id="aviso-app" hidden></div>

    <form id="form-evento">
        <input id="nombre-evento" value="Casamiento de Sofi &amp; Mateo">
        <p id="nombre-evento-error"></p>
        <input id="fecha-evento" type="date" value="2026-11-14">
        <p id="fecha-evento-error"></p>
        <select id="tipo-evento">
            <option value="">Seleccionar tipo de evento</option>
            <option value="cumpleaños">Cumpleaños</option>
            <option value="boda" selected>Casamiento / Boda</option>
            <option value="salida casual">Salida casual</option>
        </select>
        <p id="tipo-evento-error"></p>
        <input id="presupuesto-estimado" type="number" value="700000">
        <p id="presupuesto-estimado-error"></p>
        <input id="ubicacion" value="Quinta El Ombú, Pilar, Buenos Aires">
        <p id="ubicacion-error"></p>
        <button type="submit" id="btn-guardar-evento">Guardar Cambios</button>
        <div id="confirmacion-evento" hidden></div>
    </form>

    <form id="form-presupuesto">
        <table>
            <tbody id="desglose-presupuesto">
                <tr data-item data-categoria="Catering" data-descripcion="Finger food premium y barra libre" data-precio-unitario="3500">
                    <td><input id="cantidad-catering" class="input-cantidad" type="number" value="120"><span id="cantidad-catering-error"></span></td>
                    <td data-subtotal></td>
                </tr>
                <tr data-item data-categoria="Decoración" data-descripcion="Arreglos florales y ambientación luces" data-precio-unitario="70000">
                    <td><input id="cantidad-decoracion" class="input-cantidad" type="number" value="1"><span id="cantidad-decoracion-error"></span></td>
                    <td data-subtotal></td>
                </tr>
                <tr data-item data-categoria="Sonido" data-descripcion="DJ set completo y sonido de pista" data-precio-unitario="8000">
                    <td><input id="cantidad-sonido" class="input-cantidad" type="number" value="6"><span id="cantidad-sonido-error"></span></td>
                    <td data-subtotal></td>
                </tr>
                <tr data-item data-categoria="Fotografía" data-descripcion="Cobertura de evento y álbum digital" data-precio-unitario="32000">
                    <td><input id="cantidad-fotografia" class="input-cantidad" type="number" value="1"><span id="cantidad-fotografia-error"></span></td>
                    <td data-subtotal></td>
                </tr>
                <tr data-item data-categoria="Transporte" data-descripcion="Traslado de materiales y coordinación" data-precio-unitario="5000">
                    <td><input id="cantidad-transporte" class="input-cantidad" type="number" value="2"><span id="cantidad-transporte-error"></span></td>
                    <td data-subtotal></td>
                </tr>
            </tbody>
        </table>
        <span id="subtotal-presupuesto"></span>
        <input id="descuento-presupuesto" type="number" value="0"><span id="descuento-presupuesto-error"></span>
        <output id="total-presupuesto"></output>
        <button type="submit" id="btn-calcular-presupuesto">Calcular presupuesto</button>
        <div id="alerta-presupuesto" hidden></div>
        <div data-grafico-contenedor style="height: 220px;">
            <canvas id="grafico-presupuesto"></canvas>
            <p id="aviso-grafico-presupuesto" hidden></p>
        </div>
    </form>

    <form id="form-catalogo" action="#">
        <input id="buscar-catalogo" type="search">
        <select id="categoria-catalogo">
            <option value="" selected>Todas</option>
            <option value="Catering">Catering</option>
            <option value="Decoración">Decoración</option>
            <option value="Sonido">Sonido</option>
        </select>
    </form>
    <p id="contador-catalogo"></p>
    <p id="catalogo-vacio" hidden></p>
    <div data-grafico-contenedor style="height: 180px;">
        <canvas id="grafico-catalogo"></canvas>
        <p id="aviso-grafico-catalogo" hidden></p>
    </div>
    <div id="contenedor-catalogo">
        <div data-proveedor data-nombre="Gourmet Finger Food" data-categoria="Catering" data-precio="3500" data-unidad="pax"></div>
        <div data-proveedor data-nombre="Flores Pilar" data-categoria="Decoración" data-precio="70000" data-unidad="base"></div>
        <div data-proveedor data-nombre="DJ Lucas &amp; Sonido" data-categoria="Sonido" data-precio="8000" data-unidad="hora"></div>
    </div>

    <form id="form-invitado">
        <input id="nombre-invitado">
        <p id="nombre-invitado-error"></p>
        <select id="estado-invitado">
            <option value="Pendiente" selected>Pendiente</option>
            <option value="Confirmado">Confirmado</option>
        </select>
        <p id="estado-invitado-error"></p>
        <button type="submit" id="btn-agregar-invitado">Agregar invitado</button>
    </form>
    <div id="feedback-invitados" hidden></div>
    <p id="metricas-invitados"></p>
    <table>
        <tbody id="lista-invitados">
            <tr data-nombre="Sofía Rodríguez" data-estado="Confirmado"></tr>
            <tr data-nombre="Mateo González" data-estado="Confirmado"></tr>
            <tr data-nombre="Valentina Benítez" data-estado="Pendiente"></tr>
        </tbody>
    </table>

    <!-- Bootstrap JS 5.3.3: copia local del mismo archivo que index.html (Modal y Toast reales para RC14/RC15).
         Sin atributo integrity: en file:// Chrome no puede verificar SRI (no hay CORS) y bloquea el
         archivo. El sha384 coincide con el integrity de index.html; ver vendor/LEEME.md. -->
    <script src="vendor/bootstrap-5.3.3/bootstrap.bundle.min.js"></script>

    <!-- Tu código fuente -->
    <script src="../models/Validador.js"></script>
    <script src="../models/ItemContratado.js"></script>
    <script src="../models/Presupuesto.js"></script>
    <script src="../models/Invitado.js"></script>
    <script src="../models/ListaInvitados.js"></script>
    <script src="../models/Evento.js"></script>
    <script src="../models/Proveedor.js"></script>
    <script src="../models/CatalogoProveedores.js"></script>
    <script src="../utils/storage.js"></script>
    <script src="../services/ServicioPersistenciaEvento.js"></script>
    <!-- Stub de fetch para el runner (PR #147, review B1): en file:// fetch no funciona,
         así que api/proveedores.json se responde con un fixture igual al archivo real.
         Los specs que necesiten otro comportamiento pueden usar spyOn(window, "fetch"). -->
    <script>
    (function () {
      const fetchOriginal = window.fetch.bind(window);
      const fixture = {
        "version": 1,
        "proveedores": [
          {
            "nombre": "Gourmet Finger Food",
            "categoria": "Catering",
            "precio": 3500,
            "unidad": "pax",
            "imagen": "catalogo-gourmet-finger-food-450w.jpg",
            "alt": "Mesa de catering con bandejas de mini sándwiches y bocados en varios niveles",
            "descripcion": "Selección premium fría y caliente para recepción. Variedad para todos los gustos.",
            "capacidad": "Hasta 200 pax",
            "zona": "Zona Norte GBA",
            "duracion": "4 horas",
            "incluye": "Finger food frío y caliente, montaje y reposición"
          },
          {
            "nombre": "Flores Pilar",
            "categoria": "Decoración",
            "precio": 70000,
            "unidad": "base",
            "imagen": "catalogo-flores-pilar-450w.jpg",
            "alt": "Centro de mesa con rosas y peonías rosadas sobre una mesa de salón de eventos",
            "descripcion": "Centros de mesa personalizados y ramo para novias con flores naturales de estación.",
            "capacidad": "1 evento por fecha",
            "zona": "Pilar",
            "duracion": "1 jornada de montaje",
            "incluye": "Centros de mesa personalizados y ramo para novias"
          },
          {
            "nombre": "DJ Lucas & Sonido",
            "categoria": "Sonido",
            "precio": 8000,
            "unidad": "hora",
            "imagen": "catalogo-dj-lucas-sonido-450w.jpg",
            "alt": "DJ con auriculares mezclando en una consola frente a una pista iluminada",
            "descripcion": "Equipamiento de audio completo de alta fidelidad, iluminación robótica y pista de baile.",
            "capacidad": "Hasta 300 personas",
            "zona": "CABA y GBA",
            "duracion": "6 horas",
            "incluye": "DJ, sonido de alta fidelidad e iluminación robótica"
          }
        ]
      };
      window.fetch = (url, opciones) => String(url).endsWith("api/proveedores.json")
        ? Promise.resolve(new Response(JSON.stringify(fixture), {
            status: 200,
            headers: { "Content-Type": "application/json" }
          }))
        : fetchOriginal(url, opciones);
    })();
    </script>
    <script src="../api/apiService.js"></script>
    <!-- Chart.js 4.4.7: copia local del mismo archivo que index.html (dist/chart.umd.js). Sin integrity
         por el mismo motivo que Bootstrap; el sha384 coincide con el de index.html (vendor/LEEME.md). -->
    <script src="vendor/chartjs-4.4.7/chart.umd.js"></script>
    <script src="../charts/graficoService.js"></script>
    <script src="../script.js"></script>

    <!-- Tus tests -->
    <script src="models.spec.js"></script>
    <script src="storage.spec.js"></script>
    <script src="servicio-persistencia.spec.js"></script>
    <script src="script.spec.js"></script>
    <script src="api.spec.js"></script>
    <script src="library.spec.js"></script>
</body>
</html>
